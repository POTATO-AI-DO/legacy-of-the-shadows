<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon: Legacy of the Shadows</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
      user-select: none;
    }

    #gameContainer {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* ============ START SCREEN ============ */
    #startScreen {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      gap: 30px;
    }

    .start-title {
      font-size: 72px;
      font-weight: bold;
      text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.5);
      animation: float 3s ease-in-out infinite;
    }

    .start-subtitle {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .start-buttons {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .start-btn {
      padding: 15px 40px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
    }

    .start-btn.new {
      background: linear-gradient(135deg, #ff6b6b, #ff8787);
      color: white;
    }

    .start-btn.new:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(255, 107, 107, 0.6);
    }

    .start-btn.continue {
      background: linear-gradient(135deg, #4ecdc4, #44a08d);
      color: white;
    }

    .start-btn.continue:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(78, 205, 196, 0.6);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    /* ============ HOUSE REPAIR GAME ============ */
    #houseScreen {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%);
      display: none;
      flex-direction: column;
      z-index: 900;
    }

    #houseContainer {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #houseCanvas {
      display: block;
    }

    #houseUI {
      position: absolute;
      width: 100%;
      padding: 20px;
      background: rgba(0, 0, 0, 0.7);
      text-align: center;
      color: white;
    }

    #houseUI h2 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #ffaa00;
    }

    #houseUI p {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .repair-items {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .repair-item {
      padding: 12px 25px;
      background: #4CAF50;
      border: 2px solid #45a049;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
    }

    .repair-item:hover {
      background: #45a049;
      transform: scale(1.05);
    }

    .repair-item.done {
      background: #888;
      cursor: not-allowed;
      opacity: 0.6;
    }

    #houseProgress {
      margin-top: 15px;
      font-size: 16px;
    }

    .progress-bar {
      width: 300px;
      height: 25px;
      background: rgba(100, 100, 100, 0.5);
      border: 2px solid #ffaa00;
      border-radius: 12px;
      margin: 10px auto;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4CAF50, #45a049);
      width: 0%;
      transition: width 0.3s;
    }

    #continueBtn {
      margin-top: 20px;
      padding: 15px 40px;
      font-size: 18px;
      background: #667eea;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      display: none;
    }

    #continueBtn:hover {
      background: #5568d3;
    }

    /* ============ WORLD MAP ============ */
    #mapScreen {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: none;
      flex-direction: column;
      z-index: 800;
      padding: 40px;
    }

    #mapScreen h1 {
      text-align: center;
      font-size: 48px;
      margin-bottom: 40px;
      color: #ffaa00;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    .worlds-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .world-card {
      background: rgba(255, 255, 255, 0.1);
      border: 3px solid #ffaa00;
      border-radius: 15px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-height: 250px;
    }

    .world-card:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255, 170, 0, 0.5);
    }

    .world-emoji {
      font-size: 80px;
      animation: bounce 2s infinite;
    }

    .world-card:nth-child(2) .world-emoji {
      animation-delay: 0.2s;
    }

    .world-card:nth-child(3) .world-emoji {
      animation-delay: 0.4s;
    }

    .world-card:nth-child(4) .world-emoji {
      animation-delay: 0.6s;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .world-name {
      font-size: 32px;
      font-weight: bold;
      color: #fff;
    }

    .world-desc {
      font-size: 16px;
      color: #ddd;
    }

    /* ============ GAME AREA ============ */
    #gameArea {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #statusBar {
      background: rgba(0, 0, 0, 0.95);
      padding: 15px 20px;
      border-top: 3px solid #ffaa00;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.5);
    }

    .status-item {
      text-align: center;
    }

    .status-label {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 3px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-value {
      font-size: 18px;
      font-weight: bold;
      color: #ffaa00;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <!-- START SCREEN -->
    <div id="startScreen">
      <div class="start-title">🔴 Pokémon 🔴</div>
      <div class="start-subtitle">Legacy of the Shadows</div>
      <div class="start-buttons">
        <button class="start-btn new" onclick="startNewGame()">New Game</button>
        <button class="start-btn continue" onclick="continueGame()" id="continueGame" style="display:none;">Continue</button>
      </div>
    </div>

    <!-- HOUSE REPAIR SCREEN -->
    <div id="houseScreen">
      <div id="houseContainer">
        <canvas id="houseCanvas"></canvas>
        <div id="houseUI" style="position: absolute; bottom: 0; width: 100%; background: rgba(0, 0, 0, 0.85); padding: 20px; text-align: center;">
          <h2>⚒️ Repair Your House!</h2>
          <p id="repairText">Click items to fix them</p>
          <div class="repair-items">
            <button class="repair-item" onclick="repairItem(0)">🚪 Door</button>
            <button class="repair-item" onclick="repairItem(1)">🪟 Window</button>
            <button class="repair-item" onclick="repairItem(2)">🛏️ Bed</button>
            <button class="repair-item" onclick="repairItem(3)">🪑 Chair</button>
          </div>
          <div id="houseProgress">
            <p id="progressText">Progress: 0/4</p>
            <div class="progress-bar">
              <div class="progress-fill" id="progressBar"></div>
            </div>
          </div>
          <button id="continueBtn" onclick="goToMap()">Continue to Adventure ➜</button>
        </div>
      </div>
    </div>

    <!-- WORLD MAP SCREEN -->
    <div id="mapScreen">
      <h1>Choose Your First Adventure</h1>
      <div class="worlds-grid">
        <div class="world-card" onclick="selectWorld('grassland')">
          <div class="world-emoji">🌱</div>
          <div class="world-name">Grassland</div>
          <div class="world-desc">Beginner-Friendly Fields</div>
        </div>
        <div class="world-card" onclick="selectWorld('volcano')">
          <div class="world-emoji">🌋</div>
          <div class="world-name">Volcano</div>
          <div class="world-desc">Hot & Intense</div>
        </div>
        <div class="world-card" onclick="selectWorld('ocean')">
          <div class="world-emoji">🌊</div>
          <div class="world-name">Ocean</div>
          <div class="world-desc">Water Adventures</div>
        </div>
        <div class="world-card" onclick="selectWorld('mountain')">
          <div class="world-emoji">⛰️</div>
          <div class="world-name">Mountain</div>
          <div class="world-desc">High Altitude</div>
        </div>
      </div>
    </div>

    <!-- GAME AREA -->
    <div id="gameArea">
      <canvas id="canvas"></canvas>
    </div>

    <!-- STATUS BAR -->
    <div id="statusBar">
      <div class="status-item">
        <div class="status-label">Level</div>
        <div class="status-value" id="levelStatus">1</div>
      </div>
      <div class="status-item">
        <div class="status-label">Health</div>
        <div class="status-value" id="healthStatus">100/100</div>
      </div>
      <div class="status-item">
        <div class="status-label">Location</div>
        <div class="status-value" id="locationStatus">--</div>
      </div>
      <div class="status-item">
        <div class="status-label">Pokédex</div>
        <div class="status-value" id="pokedexStatus">0/16</div>
      </div>
      <div class="status-item">
        <div class="status-label">Time</div>
        <div class="status-value" id="timeStatus">0:00</div>
      </div>
    </div>
  </div>

  <script>
    // ============ GAME STATE ============
    let gameState = {
      currentScreen: 'start',
      playerName: 'Trainer',
      level: 1,
      health: 100,
      maxHealth: 100,
      caught: [],
      playTime: 0,
      currentWorld: null,
      houseRepaired: [false, false, false, false],
      starterChosen: false
    };

    // ============ CUTE POKÉMON DATA ============
    const pokemonData = {
      bulbasaur: {
        name: 'Bulbasaur', emoji: '🌿', color: '#52c84a', type: 'grass',
        baseColor: '#52c84a', eyes: { size: 6, color: 'black' },
        accent: '#2d5016'
      },
      charmander: {
        name: 'Charmander', emoji: '🔥', color: '#ff7f27', type: 'fire',
        baseColor: '#ff7f27', eyes: { size: 6, color: 'black' },
        accent: '#cc6319'
      },
      squirtle: {
        name: 'Squirtle', emoji: '🐢', color: '#4a90a4', type: 'water',
        baseColor: '#4a90a4', eyes: { size: 6, color: 'black' },
        accent: '#2d5a71'
      },
      pikachu: {
        name: 'Pikachu', emoji: '⚡', color: '#ffd700', type: 'electric',
        baseColor: '#ffd700', eyes: { size: 7, color: 'black' },
        accent: '#cc2e1d'
      },
      clefairy: {
        name: 'Clefairy', emoji: '✨', color: '#ffb6d9', type: 'fairy',
        baseColor: '#ffb6d9', eyes: { size: 6, color: 'black' },
        accent: '#9d4569'
      },
      jigglypuff: {
        name: 'Jigglypuff', emoji: '🎤', color: '#d9b3d9', type: 'normal',
        baseColor: '#d9b3d9', eyes: { size: 6, color: 'black' },
        accent: '#8b5a8b'
      },
      psyduck: {
        name: 'Psyduck', emoji: '🦆', color: '#ffeb3b', type: 'water',
        baseColor: '#ffeb3b', eyes: { size: 7, color: 'black' },
        accent: '#cc7d00'
      },
      growlithe: {
        name: 'Growlithe', emoji: '🐕', color: '#ff9c42', type: 'fire',
        baseColor: '#ff9c42', eyes: { size: 6, color: 'black' },
        accent: '#cc5519'
      },
      abra: {
        name: 'Abra', emoji: '✋', color: '#996633', type: 'psychic',
        baseColor: '#996633', eyes: { size: 7, color: '#ffff00' },
        accent: '#663300'
      },
      bellsprout: {
        name: 'Bellsprout', emoji: '🌱', color: '#00cc44', type: 'grass',
        baseColor: '#00cc44', eyes: { size: 5, color: 'black' },
        accent: '#008020'
      },
      geodude: {
        name: 'Geodude', emoji: '🪨', color: '#999999', type: 'rock',
        baseColor: '#999999', eyes: { size: 6, color: '#ffcc00' },
        accent: '#663300'
      },
      slowpoke: {
        name: 'Slowpoke', emoji: '🐚', color: '#d4a5a5', type: 'water',
        baseColor: '#d4a5a5', eyes: { size: 6, color: 'black' },
        accent: '#8b4444'
      },
      doduo: {
        name: 'Doduo', emoji: '🦅', color: '#8b4513', type: 'normal',
        baseColor: '#8b4513', eyes: { size: 5, color: 'black' },
        accent: '#5c2e0f'
      },
      gastly: {
        name: 'Gastly', emoji: '👻', color: '#6633cc', type: 'ghost',
        baseColor: '#6633cc', eyes: { size: 7, color: '#ffff00' },
        accent: '#440066'
      },
      cubone: {
        name: 'Cubone', emoji: '🦴', color: '#cc9966', type: 'ground',
        baseColor: '#cc9966', eyes: { size: 6, color: 'black' },
        accent: '#8b5a2b'
      },
      eevee: {
        name: 'Eevee', emoji: '🦊', color: '#d2691e', type: 'normal',
        baseColor: '#d2691e', eyes: { size: 6, color: 'black' },
        accent: '#8b4513'
      }
    };

    // ============ CUTE POKÉMON RENDERER ============
    function drawCutePokemon(ctx, x, y, size, pokemon, animationTime) {
      ctx.save();
      ctx.translate(x, y);

      // Bouncing animation
      const bounce = Math.sin(animationTime * 0.006) * 3;

      // Body (cute rounded shape)
      ctx.fillStyle = pokemon.baseColor;
      ctx.beginPath();
      ctx.ellipse(0, bounce, size * 0.6, size * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();

      // Head
      ctx.fillStyle = pokemon.baseColor;
      ctx.beginPath();
      ctx.arc(0, -size * 0.5 + bounce, size * 0.5, 0, Math.PI * 2);
      ctx.fill();

      // Ears (left)
      ctx.fillStyle = pokemon.baseColor;
      ctx.beginPath();
      ctx.ellipse(-size * 0.35, -size * 0.85 + bounce, size * 0.2, size * 0.3, -0.3, 0, Math.PI * 2);
      ctx.fill();

      // Ears (right)
      ctx.beginPath();
      ctx.ellipse(size * 0.35, -size * 0.85 + bounce, size * 0.2, size * 0.3, 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Eyes (big & cute)
      ctx.fillStyle = pokemon.eyes.color;
      ctx.beginPath();
      ctx.arc(-size * 0.2, -size * 0.55 + bounce, pokemon.eyes.size, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(size * 0.2, -size * 0.55 + bounce, pokemon.eyes.size, 0, Math.PI * 2);
      ctx.fill();

      // Eye shine (pupil)
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(-size * 0.18, -size * 0.57 + bounce, pokemon.eyes.size * 0.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(size * 0.22, -size * 0.57 + bounce, pokemon.eyes.size * 0.4, 0, Math.PI * 2);
      ctx.fill();

      // Mouth (cute smile)
      ctx.strokeStyle = pokemon.accent;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -size * 0.3 + bounce, size * 0.15, 0, Math.PI);
      ctx.stroke();

      // Accent color (belly/pattern)
      ctx.fillStyle = pokemon.accent;
      ctx.globalAlpha = 0.3;
      ctx.beginPath();
      ctx.ellipse(0, size * 0.1 + bounce, size * 0.4, size * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ============ START SCREEN ============
    function startNewGame() {
      gameState.currentScreen = 'house';
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('houseScreen').style.display = 'flex';
      drawHouseRepair();
    }

    function continueGame() {
      gameState.currentScreen = 'map';
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('mapScreen').style.display = 'flex';
    }

    // Check if save exists
    function checkSave() {
      const save = localStorage.getItem('pokemonSave');
      if (save) {
        document.getElementById('continueGame').style.display = 'inline-block';
      }
    }

    // ============ HOUSE REPAIR MINI-GAME ============
    function drawHouseRepair() {
      const canvas = document.getElementById('houseCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - 200;

      // Sky background
      ctx.fillStyle = '#87ceeb';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ground
      ctx.fillStyle = '#90ee90';
      ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);

      // House
      const houseX = canvas.width / 2 - 150;
      const houseY = canvas.height * 0.4;

      // House wall
      ctx.fillStyle = gameState.houseRepaired[0] ? '#cd853f' : '#8b6f47';
      ctx.fillRect(houseX, houseY, 300, 250);

      // Roof
      ctx.fillStyle = '#cc2e1d';
      ctx.beginPath();
      ctx.moveTo(houseX, houseY);
      ctx.lineTo(houseX + 150, houseY - 80);
      ctx.lineTo(houseX + 300, houseY);
      ctx.fill();

      // Door (clickable area: 220-280, 520-600)
      ctx.fillStyle = gameState.houseRepaired[0] ? '#228B22' : '#8b4513';
      ctx.fillRect(houseX + 120, houseY + 150, 60, 100);
      ctx.fillStyle = '#ffdd00';
      ctx.beginPath();
      ctx.arc(houseX + 175, houseY + 200, 5, 0, Math.PI * 2);
      ctx.fill();

      // Window (left)
      ctx.fillStyle = gameState.houseRepaired[1] ? '#87ceeb' : '#999';
      ctx.fillRect(houseX + 30, houseY + 60, 50, 50);

      // Window (right)
      ctx.fillRect(houseX + 220, houseY + 60, 50, 50);

      // Bed (inside)
      ctx.fillStyle = gameState.houseRepaired[2] ? '#ff69b4' : '#8b0000';
      ctx.fillRect(houseX + 40, houseY + 180, 80, 50);

      // Chair
      ctx.fillStyle = gameState.houseRepaired[3] ? '#228B22' : '#666';
      ctx.fillRect(houseX + 200, houseY + 170, 40, 40);

      // Animation loop
      requestAnimationFrame(drawHouseRepair);
    }

    function repairItem(index) {
      if (!gameState.houseRepaired[index]) {
        gameState.houseRepaired[index] = true;
        updateHouseProgress();
      }
    }

    function updateHouseProgress() {
      const repaired = gameState.houseRepaired.filter(r => r).length;
      const total = 4;
      document.getElementById('progressBar').style.width = (repaired / total) * 100 + '%';
      document.getElementById('progressText').textContent = `Progress: ${repaired}/${total}`;

      const buttons = document.querySelectorAll('.repair-item');
      buttons.forEach((btn, i) => {
        if (gameState.houseRepaired[i]) {
          btn.classList.add('done');
          btn.disabled = true;
        }
      });

      if (repaired === total) {
        document.getElementById('continueBtn').style.display = 'block';
      }
    }

    function goToMap() {
      gameState.currentScreen = 'map';
      document.getElementById('houseScreen').style.display = 'none';
      document.getElementById('mapScreen').style.display = 'flex';
    }

    // ============ WORLD MAP ============
    function selectWorld(world) {
      gameState.currentWorld = world;
      gameState.currentScreen = 'game';
      document.getElementById('mapScreen').style.display = 'none';
      document.getElementById('gameArea').style.display = 'flex';
      document.getElementById('statusBar').style.display = 'grid';
      startGame(world);
    }

    // ============ MAIN GAME ============
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function startGame(world) {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - 60;

      const worldColors = {
        grassland: { bg: '#90ee90', ground: '#228B22' },
        volcano: { bg: '#ff6b35', ground: '#cc2e1d' },
        ocean: { bg: '#87ceeb', ground: '#4a90a4' },
        mountain: { bg: '#b0c4de', ground: '#8b7355' }
      };

      const colors = worldColors[world];

      // Game loop
      setInterval(() => {
        ctx.fillStyle = colors.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Ground
        ctx.fillStyle = colors.ground;
        ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);

        // Draw cute Pokémon
        let pokemonList = Object.values(pokemonData);
        let cols = Math.ceil(Math.sqrt(pokemonList.length));
        let size = Math.min(canvas.width / (cols + 1), 60);

        pokemonList.forEach((pok, i) => {
          const row = Math.floor(i / cols);
          const col = i % cols;
          const x = (col + 1) * (canvas.width / (cols + 1));
          const y = (row + 1) * (canvas.height / 4);
          drawCutePokemon(ctx, x, y, size, pok, Date.now());
        });

        // Update status
        document.getElementById('locationStatus').textContent = world.toUpperCase();
        document.getElementById('pokedexStatus').textContent = `${gameState.caught.length}/16`;
      }, 30);

      // Save game
      localStorage.setItem('pokemonSave', JSON.stringify(gameState));
    }

    // ============ INITIALIZATION ============
    checkSave();
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - 60;
    });
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon: Legacy of the Shadows</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #gameContainer {
      width: 1280px;
      height: 720px;
      position: relative;
      background: #1a1a2e;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hud {
      position: absolute;
      color: white;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }
    #playerInfo { top: 20px; left: 20px; font-size: 18px; }
    #teamHud { top: 20px; right: 20px; display: flex; gap: 10px; }
    .teamMember {
      width: 80px;
      height: 60px;
      background: rgba(0, 0, 0, 0.6);
      border: 3px solid #00ff00;
      border-radius: 8px;
      padding: 5px;
      text-align: center;
      font-size: 12px;
      color: #00ff00;
    }
    #moveHud { bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; pointer-events: auto; }
    .moveBtn {
      width: 120px;
      height: 100px;
      background: rgba(0, 0, 0, 0.8);
      border: 3px solid #ffaa00;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s;
    }
    .moveBtn:hover { transform: scale(1.05); }
    .moveBtn:active { transform: scale(0.95); }
    .cooldown {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffaa00;
      font-size: 16px;
      font-weight: bold;
    }
    #itemWheel { bottom: 20px; left: 20px; font-size: 16px; color: white; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8); }
    #menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.95);
      border: 4px solid #ffaa00;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      color: white;
      z-index: 100;
      display: none;
      pointer-events: auto;
      max-width: 500px;
    }
    #menu h2 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #ffaa00;
    }
    .menuBtn {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      background: #667eea;
      border: 2px solid #ffaa00;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .menuBtn:hover {
      background: #764ba2;
      transform: scale(1.05);
    }
    #starterSelect {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.95);
      border: 4px solid #ffaa00;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      color: white;
      z-index: 100;
      pointer-events: auto;
    }
    #starterSelect h2 {
      font-size: 32px;
      margin-bottom: 30px;
      color: #ffaa00;
    }
    .starterGrid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 400px;
    }
    .starterOption {
      padding: 20px;
      background: #667eea;
      border: 3px solid #ffaa00;
      border-radius: 15px;
      color: white;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .starterOption:hover {
      background: #764ba2;
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(255, 170, 0, 0.8);
    }
    #mapOverlay {
      display: none;
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 50;
      pointer-events: auto;
    }
    #mapContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      background: rgba(20, 20, 40, 0.8);
      border: 4px solid #ffaa00;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .landBtn {
      padding: 12px 20px;
      background: #667eea;
      border: 2px solid #ffaa00;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }
    .landBtn:hover {
      background: #764ba2;
      transform: scale(1.05);
    }
    .landBtn.completed {
      background: #00aa00;
      border-color: #00ff00;
    }
    #pokedexOverlay {
      display: none;
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 60;
      pointer-events: auto;
      overflow-y: auto;
      padding: 40px;
    }
    #pokedexGrid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .pokedexSlot {
      width: 80px;
      height: 80px;
      background: rgba(100, 100, 150, 0.6);
      border: 2px solid #ffaa00;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      padding: 5px;
    }
    .pokedexSlot:hover { transform: scale(1.1); background: rgba(150, 100, 200, 0.8); }
    .pokedexSlot.caught {
      border-color: #00ff00;
      background: rgba(0, 100, 50, 0.6);
    }
    .pokedexSlot.shiny {
      border-color: #ffff00;
      background: rgba(150, 150, 0, 0.6);
    }
    #purificationOverlay {
      display: none;
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 70;
      pointer-events: auto;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }
    #purificationPrompt {
      font-size: 32px;
      color: #ffaa00;
      font-weight: bold;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
    }
    #purificationBar {
      width: 400px;
      height: 40px;
      background: rgba(0, 0, 0, 0.8);
      border: 3px solid #ffaa00;
      border-radius: 10px;
      overflow: hidden;
    }
    #purificationProgress {
      height: 100%;
      background: linear-gradient(90deg, #00ff00, #ffaa00);
      width: 0%;
      transition: width 0.1s;
    }
    #purificationBtn {
      padding: 15px 40px;
      background: #00ff00;
      border: 3px solid #ffaa00;
      border-radius: 10px;
      font-weight: bold;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.1s;
      color: #000;
    }
    #purificationBtn:active { transform: scale(0.95); }
    .notification {
      position: absolute;
      top: 100px;
      right: 20px;
      background: rgba(0, 0, 0, 0.9);
      color: #00ff00;
      padding: 15px 20px;
      border: 2px solid #00ff00;
      border-radius: 10px;
      font-weight: bold;
      animation: slideIn 0.3s ease-out;
      z-index: 80;
      pointer-events: none;
    }
    .notification.shiny {
      color: #ffff00;
      border-color: #ffff00;
      animation: pulse 0.5s infinite;
    }
    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    #debugInfo {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: #00ff00;
      padding: 10px 15px;
      border: 2px solid #00ff00;
      border-radius: 5px;
      font-size: 12px;
      font-family: monospace;
      max-width: 300px;
      z-index: 40;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="playerInfo" class="hud">Player Level: <span id="playerLevel">1</span> | HP: <span id="playerHP">100</span>/100</div>
      <div id="teamHud" class="hud">
        <div class="teamMember">
          <div id="team0Name">–</div>
          <div id="team0HP" style="font-size: 10px;">–</div>
        </div>
        <div class="teamMember">
          <div id="team1Name">–</div>
          <div id="team1HP" style="font-size: 10px;">–</div>
        </div>
        <div class="teamMember">
          <div id="team2Name">–</div>
          <div id="team2HP" style="font-size: 10px;">–</div>
        </div>
      </div>
      <div id="moveHud">
        <button class="moveBtn" id="moveBtn1">Move 1<div class="cooldown" id="cooldown1" style="display: none;"></div></button>
        <button class="moveBtn" id="moveBtn2">Move 2<div class="cooldown" id="cooldown2" style="display: none;"></div></button>
      </div>
      <div id="itemWheel">Items: <span id="itemCount">5</span></div>
      <div id="debugInfo" style="display: none;">FPS: <span id="fps">60</span> | Enemies: <span id="enemyCount">0</span></div>
    </div>
    <div id="starterSelect">
      <h2>Choose Your Starter!</h2>
      <div class="starterGrid">
        <div class="starterOption" onclick="selectStarter('charmander')">🔥 Charmander</div>
        <div class="starterOption" onclick="selectStarter('squirtle')">💧 Squirtle</div>
        <div class="starterOption" onclick="selectStarter('bulbasaur')">🌿 Bulbasaur</div>
        <div class="starterOption" onclick="selectStarter('pikachu')">⚡ Pikachu</div>
      </div>
    </div>
    <div id="menu">
      <h2>PAUSED</h2>
      <button class="menuBtn" onclick="togglePause()">Resume</button>
      <button class="menuBtn" onclick="togglePokedex()">Pokédex</button>
      <button class="menuBtn" onclick="toggleMap()">Map</button>
      <button class="menuBtn" onclick="saveGame()">Save</button>
      <button class="menuBtn" onclick="mainMenu()">Main Menu</button>
    </div>
    <div id="mapOverlay">
      <div id="mapContainer">
        <h2 style="color: #ffaa00; font-size: 28px; margin-bottom: 20px;">EXPEDITION MAP</h2>
        <div id="landsList"></div>
        <button class="menuBtn" onclick="toggleMap()" style="width: 200px; margin-top: 20px;">Close Map</button>
      </div>
    </div>
    <div id="pokedexOverlay">
      <div style="text-align: center; margin-bottom: 30px;">
        <h2 style="color: #ffaa00; font-size: 28px;">POKÉDEX</h2>
        <p style="color: white; font-size: 16px;">Caught: <span id="caughtCount">0</span>/151</p>
      </div>
      <div id="pokedexGrid"></div>
      <button class="menuBtn" onclick="togglePokedex()" style="width: 200px; margin-top: 30px; margin-left: 50%; transform: translateX(-50%);">Close Pokédex</button>
    </div>
    <div id="purificationOverlay">
      <div id="purificationPrompt">PURIFY THE SHADOW!</div>
      <div id="purificationBar"><div id="purificationProgress"></div></div>
      <button id="purificationBtn" onmousedown="purifyTap()" onmouseup="purifyRelease()">MASH SPACE!</button>
      <p style="color: white; font-size: 18px;">Taps: <span id="purificationTaps">0</span>/20</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ===== GAME STATE =====
    const gameState = {
      starter: null,
      playerLevel: 1,
      playerHP: 100,
      playerMaxHP: 100,
      team: [],
      pokedex: new Array(151).fill(false),
      shinies: new Array(151).fill(false),
      currentLand: 'intro',
      completedLands: [],
      isPaused: false,
      gameStarted: false,
      purifying: false
    };

    const pokedexData = {
      1: { name: 'Bulbasaur', type: 'Grass/Poison' },
      4: { name: 'Charmander', type: 'Fire' },
      7: { name: 'Squirtle', type: 'Water' },
      25: { name: 'Pikachu', type: 'Electric' },
      145: { name: 'Zapdos', type: 'Electric/Flying' },
      146: { name: 'Moltres', type: 'Fire/Flying' },
      144: { name: 'Articuno', type: 'Ice/Flying' },
      249: { name: 'Lugia', type: 'Psychic/Flying' },
    };

    // ===== THREE.JS SCENE =====
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 200, 500);

    const camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.set(0, 12, 15);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(20, 30, 20);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    directionalLight.shadow.camera.far = 100;
    directionalLight.shadow.camera.left = -50;
    directionalLight.shadow.camera.right = 50;
    directionalLight.shadow.camera.top = 50;
    directionalLight.shadow.camera.bottom = -50;
    scene.add(directionalLight);

    // Ground
    const groundGeom = new THREE.PlaneGeometry(200, 200);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x90ee90, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeom, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ===== SIMPLE TOY-STYLE POKEMON FACTORY =====
    function createToyPokemon(name) {
      const group = new THREE.Group();

      // Body (chunky, exaggerated)
      const bodyGeom = new THREE.BoxGeometry(1, 1.2, 0.8);
      const bodyMat = new THREE.MeshStandardMaterial({
        color: getTypeColor(name),
        roughness: 0.3,
        metalness: 0.1
      });
      const body = new THREE.Mesh(bodyGeom, bodyMat);
      body.position.y = 0.6;
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      // Head
      const headGeom = new THREE.SphereGeometry(0.5, 8, 8);
      const headMat = new THREE.MeshStandardMaterial({
        color: getTypeColor(name),
        roughness: 0.3
      });
      const head = new THREE.Mesh(headGeom, headMat);
      head.position.y = 1.5;
      head.castShadow = true;
      group.add(head);

      // Eyes (simple)
      const eyeGeom = new THREE.SphereGeometry(0.15, 8, 8);
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
      const eye1 = new THREE.Mesh(eyeGeom, eyeMat);
      eye1.position.set(-0.15, 1.7, 0.4);
      const eye2 = new THREE.Mesh(eyeGeom, eyeMat);
      eye2.position.set(0.15, 1.7, 0.4);
      group.add(eye1, eye2);

      // Legs
      const legGeom = new THREE.BoxGeometry(0.3, 0.6, 0.3);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 });
      for (let i = 0; i < 4; i++) {
        const leg = new THREE.Mesh(legGeom, legMat);
        leg.position.set((i < 2 ? -0.3 : 0.3), 0.3, (i % 2 === 0 ? -0.2 : 0.2));
        leg.castShadow = true;
        group.add(leg);
      }

      // Shadow aura for Shadow Pokémon
      if (name.includes('shadow')) {
        const auraGeom = new THREE.SphereGeometry(1.3, 16, 16);
        const auraMat = new THREE.MeshStandardMaterial({
          color: 0x8b008b,
          transparent: true,
          opacity: 0.3,
          emissive: 0x8b008b,
          emissiveIntensity: 0.5
        });
        const aura = new THREE.Mesh(auraGeom, auraMat);
        aura.position.y = 0.6;
        group.add(aura);
      }

      return group;
    }

    function getTypeColor(name) {
      const typeColors = {
        'charmander': 0xff6347, 'fire': 0xff6347,
        'squirtle': 0x4169e1, 'water': 0x4169e1,
        'bulbasaur': 0x32cd32, 'grass': 0x32cd32,
        'pikachu': 0xffd700, 'electric': 0xffd700,
        'zapdos': 0xffd700, 'moltres': 0xff6347, 'articuno': 0x87ceeb,
        'lugia': 0x696969, 'mewtwo': 0x9932cc
      };
      for (const [type, color] of Object.entries(typeColors)) {
        if (name.toLowerCase().includes(type)) return color;
      }
      return 0xcccccc;
    }

    // ===== PLAYER AND ENEMIES =====
    let player = null;
    let enemies = [];
    let allies = [];

    function initPlayer(starterName) {
      if (player) scene.remove(player);
      player = createToyPokemon(starterName);
      player.position.set(0, 0, 0);
      player.userData = {
        name: starterName,
        hp: gameState.playerMaxHP,
        maxHP: gameState.playerMaxHP,
        level: gameState.playerLevel,
        move1Cooldown: 0,
        move2Cooldown: 0,
        velocity: new THREE.Vector3()
      };
      scene.add(player);
      gameState.team[0] = { name: starterName, hp: gameState.playerMaxHP, maxHP: gameState.playerMaxHP };
      updateTeamHUD();
    }

    function spawnEnemy(x, z, isShadow = false) {
      const enemyNames = ['squirtle', 'charmander', 'bulbasaur', 'pikachu'];
      const enemyName = (isShadow ? 'shadow_' : '') + enemyNames[Math.floor(Math.random() * enemyNames.length)];
      const enemy = createToyPokemon(enemyName);
      enemy.position.set(x, 0, z);
      enemy.userData = {
        name: enemyName,
        hp: isShadow ? 80 : 50,
        maxHP: isShadow ? 80 : 50,
        level: gameState.playerLevel,
        isShadow: isShadow,
        isMiniBoss: Math.random() < 0.1 && !isShadow,
        velocity: new THREE.Vector3(),
        attackCooldown: 0
      };
      if (enemy.userData.isMiniBoss) {
        enemy.userData.hp *= 2;
        enemy.userData.maxHP *= 2;
        enemy.scale.set(1.3, 1.3, 1.3);
      }
      scene.add(enemy);
      enemies.push(enemy);
    }

    // ===== INPUT =====
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ') { e.preventDefault(); if (!gameState.purifying) performAttack(1); }
      if (e.key === 'e') performAttack(2);
      if (e.key === 'q') performDodge();
      if (e.key === 'Escape') togglePause();
      if (e.key === 'm') toggleMap();
      if (e.key === 'p') togglePokedex();
    });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    // ===== COMBAT =====
    function performAttack(moveNum) {
      if (!player || gameState.purifying) return;
      const cooldownKey = `move${moveNum}Cooldown`;
      if (player.userData[cooldownKey] > 0) return;

      player.userData[cooldownKey] = 2;
      const moveBtn = document.getElementById(`moveBtn${moveNum}`);
      moveBtn.style.opacity = '0.5';

      // Find closest enemy
      let closest = null;
      let minDist = Infinity;
      enemies.forEach(e => {
        const dist = player.position.distanceTo(e.position);
        if (dist < minDist) { minDist = dist; closest = e; }
      });

      if (closest && minDist < 8) {
        const damage = 15 + Math.random() * 10;
        closest.userData.hp -= damage;
        if (closest.userData.hp <= 0) {
          handleEnemyDefeated(closest);
        }
      }
    }

    function performDodge() {
      if (!player) return;
      player.userData.velocity.x += (Math.random() - 0.5) * 20;
      player.userData.velocity.z += (Math.random() - 0.5) * 20;
    }

    function handleEnemyDefeated(enemy) {
      scene.remove(enemy);
      enemies = enemies.filter(e => e !== enemy);

      gameState.playerLevel++;
      gameState.playerMaxHP = 100 + gameState.playerLevel * 10;
      gameState.playerHP = gameState.playerMaxHP;
      player.userData.hp = gameState.playerMaxHP;

      if (enemy.userData.isShadow || enemy.userData.isMiniBoss) {
        showPurificationUI(enemy.userData.name);
      } else {
        addNotification('Pokémon Defeated!');
      }
    }

    // ===== PURIFICATION =====
    let purificationData = { name: '', taps: 0, target: 20 };

    function showPurificationUI(pokemonName) {
      gameState.purifying = true;
      purificationData = { name: pokemonName, taps: 0, target: 20 };
      document.getElementById('purificationOverlay').style.display = 'flex';
      document.getElementById('purificationPrompt').textContent = `PURIFY ${pokemonName.toUpperCase()}!`;
      document.getElementById('purificationProgress').style.width = '0%';
      document.getElementById('purificationTaps').textContent = '0';
    }

    function purifyTap() {
      if (!gameState.purifying) return;
      purificationData.taps++;
      const progress = (purificationData.taps / purificationData.target) * 100;
      document.getElementById('purificationProgress').style.width = Math.min(progress, 100) + '%';
      document.getElementById('purificationTaps').textContent = purificationData.taps;

      if (purificationData.taps >= purificationData.target) {
        completePurification();
      }
    }

    function purifyRelease() {}

    function completePurification() {
      gameState.purifying = false;
      document.getElementById('purificationOverlay').style.display = 'none';

      const isShiny = Math.random() < 0.15;
      const pokeId = Math.floor(Math.random() * 151) + 1;
      gameState.pokedex[pokeId] = true;
      if (isShiny) gameState.shinies[pokeId] = true;

      const notification = isShiny ? `✨ SHINY PURIFIED! ✨` : `✓ Pokémon Purified!`;
      addNotification(notification, isShiny);

      if (Math.random() < 0.5) {
        gameState.team.push({ name: purificationData.name, hp: 100, maxHP: 100 });
        addNotification(`${purificationData.name} joined your team!`);
      }
    }

    // ===== UI =====
    function updateTeamHUD() {
      for (let i = 0; i < 3; i++) {
        const member = gameState.team[i];
        const nameEl = document.getElementById(`team${i}Name`);
        const hpEl = document.getElementById(`team${i}HP`);
        if (member) {
          nameEl.textContent = member.name.substring(0, 6);
          hpEl.textContent = `${Math.ceil(member.hp)}/${member.maxHP}`;
        } else {
          nameEl.textContent = '–';
          hpEl.textContent = '–';
        }
      }
      document.getElementById('playerLevel').textContent = gameState.playerLevel;
      document.getElementById('playerHP').textContent = Math.ceil(gameState.playerHP);
    }

    function addNotification(text, isShiny = false) {
      const notif = document.createElement('div');
      notif.className = 'notification' + (isShiny ? ' shiny' : '');
      notif.textContent = text;
      document.getElementById('ui').appendChild(notif);
      setTimeout(() => notif.remove(), 3000);
    }

    function togglePause() {
      gameState.isPaused = !gameState.isPaused;
      document.getElementById('menu').style.display = gameState.isPaused ? 'block' : 'none';
    }

    function toggleMap() {
      const mapOverlay = document.getElementById('mapOverlay');
      const isVisible = mapOverlay.style.display === 'block';
      mapOverlay.style.display = isVisible ? 'none' : 'block';
      if (!isVisible) populateMapUI();
    }

    function togglePokedex() {
      const pokedexOverlay = document.getElementById('pokedexOverlay');
      const isVisible = pokedexOverlay.style.display === 'block';
      pokedexOverlay.style.display = isVisible ? 'none' : 'block';
      if (!isVisible) populatePokedexUI();
    }

    function populateMapUI() {
      const landsList = document.getElementById('landsList');
      landsList.innerHTML = '';
      const lands = [
        'Frostpeak Valley',
        'Stonehorn Ridge',
        'Blazebelly Crater',
        'Suncinder Dunes',
        'Gloomroot Caverns',
        'Verdantwild Grove',
        'Tidecall Reef',
        'Shadow Realm'
      ];
      lands.forEach(land => {
        const btn = document.createElement('button');
        btn.className = 'landBtn' + (gameState.completedLands.includes(land) ? ' completed' : '');
        btn.textContent = land;
        btn.onclick = () => {
          gameState.currentLand = land;
          toggleMap();
          spawnLandEnemies(land);
        };
        landsList.appendChild(btn);
      });
    }

    function populatePokedexUI() {
      const grid = document.getElementById('pokedexGrid');
      grid.innerHTML = '';
      let caught = 0;
      for (let i = 1; i <= 151; i++) {
        const slot = document.createElement('div');
        slot.className = 'pokedexSlot';
        if (gameState.pokedex[i]) {
          caught++;
          slot.classList.add('caught');
          if (gameState.shinies[i]) slot.classList.add('shiny');
          slot.textContent = `#${i}`;
        } else {
          slot.textContent = '?';
        }
        grid.appendChild(slot);
      }
      document.getElementById('caughtCount').textContent = caught;
    }

    function spawnLandEnemies(landName) {
      enemies.forEach(e => scene.remove(e));
      enemies = [];

      const enemyCount = 8 + Math.floor(Math.random() * 4);
      for (let i = 0; i < enemyCount; i++) {
        const x = (Math.random() - 0.5) * 40;
        const z = 10 + Math.random() * 30;
        const isShadow = Math.random() < 0.3;
        spawnEnemy(x, z, isShadow);
      }

      addNotification(`Entered ${landName}!`);
    }

    function selectStarter(name) {
      gameState.starter = name;
      gameState.gameStarted = true;
      document.getElementById('starterSelect').style.display = 'none';
      initPlayer(name);
      spawnLandEnemies('Starter Valley');
    }

    function saveGame() {
      const save = {
        starter: gameState.starter,
        playerLevel: gameState.playerLevel,
        team: gameState.team,
        pokedex: gameState.pokedex,
        shinies: gameState.shinies,
        completedLands: gameState.completedLands
      };
      localStorage.setItem('legacySave', JSON.stringify(save));
      addNotification('Game Saved!');
    }

    function loadGame() {
      const save = localStorage.getItem('legacySave');
      if (save) {
        const data = JSON.parse(save);
        gameState.starter = data.starter;
        gameState.playerLevel = data.playerLevel;
        gameState.team = data.team;
        gameState.pokedex = data.pokedex;
        gameState.shinies = data.shinies;
        gameState.completedLands = data.completedLands;
        selectStarter(gameState.starter);
      }
    }

    function mainMenu() {
      gameState.gameStarted = false;
      gameState.isPaused = false;
      document.getElementById('menu').style.display = 'none';
      document.getElementById('starterSelect').style.display = 'block';
      enemies.forEach(e => scene.remove(e));
      enemies = [];
      if (player) scene.remove(player);
      player = null;
    }

    // ===== ANIMATION LOOP =====
    let lastTime = Date.now();
    let frameCount = 0;
    let fps = 60;

    function animate() {
      requestAnimationFrame(animate);

      const now = Date.now();
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      frameCount++;
      if (frameCount % 10 === 0) fps = Math.round(1 / dt);

      if (!gameState.isPaused && player) {
        // Player movement
        const moveForce = 30;
        if (keys['w']) player.userData.velocity.z -= moveForce * dt;
        if (keys['s']) player.userData.velocity.z += moveForce * dt;
        if (keys['a']) player.userData.velocity.x -= moveForce * dt;
        if (keys['d']) player.userData.velocity.x += moveForce * dt;

        // Friction
        player.userData.velocity.multiplyScalar(0.85);
        player.position.add(player.userData.velocity.clone().multiplyScalar(dt));

        // Boundary
        player.position.clampScalar(-80, 80);

        // Update camera
        camera.position.copy(player.position).add(new THREE.Vector3(0, 12, 15));
        camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 2, 0)));

        // Enemy AI and attacks
        enemies.forEach(enemy => {
          const dir = player.position.clone().sub(enemy.position);
          const dist = dir.length();
          if (dist > 0.1) dir.normalize();

          // Chase player
          const moveSpeed = enemy.userData.isShadow ? 12 : 8;
          enemy.userData.velocity.add(dir.multiplyScalar(moveSpeed * dt));
          enemy.userData.velocity.multiplyScalar(0.8);
          enemy.position.add(enemy.userData.velocity.clone().multiplyScalar(dt));

          // Attack
          enemy.userData.attackCooldown -= dt;
          if (dist < 5 && enemy.userData.attackCooldown <= 0) {
            const damage = 5 + Math.random() * 5;
            player.userData.hp -= damage;
            gameState.playerHP = player.userData.hp;
            enemy.userData.attackCooldown = 1.5;
          }
        });

        // Update cooldowns
        player.userData.move1Cooldown -= dt;
        player.userData.move2Cooldown -= dt;
        if (player.userData.move1Cooldown <= 0) document.getElementById('moveBtn1').style.opacity = '1';
        if (player.userData.move2Cooldown <= 0) document.getElementById('moveBtn2').style.opacity = '1';

        // Check player defeat
        if (player.userData.hp <= 0) {
          addNotification('You were defeated! Game Over.');
          mainMenu();
        }
      }

      document.getElementById('fps').textContent = fps;
      document.getElementById('enemyCount').textContent = enemies.length;
      updateTeamHUD();
      renderer.render(scene, camera);
    }

    // ===== STARTUP =====
    window.addEventListener('load', () => {
      loadGame();
      if (!gameState.gameStarted) {
        document.getElementById('starterSelect').style.display = 'block';
      }
      animate();
    });
  </script>
</body>
</html>
